<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat → Open WebUI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      width: 360px;
      min-height: 420px;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #059669, #6366f1);
      padding: 16px 18px 14px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: #fff;
    }
    .header p {
      font-size: 11px;
      color: rgba(255,255,255,0.75);
      margin-top: 2px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .tab {
      flex: 1;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      color: #94a3b8;
      border: none;
      background: none;
      transition: color 0.15s, border-bottom 0.15s;
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      color: #10b981;
      border-bottom: 2px solid #10b981;
    }

    /* ── Panels ── */
    .panel { display: none; padding: 16px; }
    .panel.active { display: block; }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      margin-top: 14px;
    }
    label:first-of-type { margin-top: 0; }

    input[type="text"],
    input[type="password"],
    input[type="url"] {
      width: 100%;
      padding: 9px 11px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #10b981; }

    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .input-row input { flex: 1; }

    .icon-btn {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      padding: 9px 10px;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: #334155; }

    .domain-preview {
      font-size: 11px;
      color: #64748b;
      margin-top: 5px;
      min-height: 16px;
    }
    .domain-preview.valid { color: #10b981; }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; transform: scale(1.01); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-green  { background: linear-gradient(135deg,#059669,#10b981); color:#fff; }
    .btn-indigo { background: linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; }
    .btn-red    { background: #7f1d1d; color: #fca5a5; display: none; }

    /* ── Save indicator ── */
    #saveIndicator {
      display: none;
      font-size: 11px;
      color: #10b981;
      text-align: center;
      margin-top: 8px;
    }

    /* ── Status messages ── */
    .status {
      margin-top: 10px;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      display: none;
    }
    .status.success { background:#064e3b; color:#6ee7b7; display:block; }
    .status.error   { background:#450a0a; color:#fca5a5; display:block; }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed #334155;
      border-radius: 10px;
      padding: 22px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-top: 14px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #6366f1;
      background: rgba(99,102,241,0.06);
    }
    .drop-zone p { font-size: 12px; color: #64748b; margin-top: 4px; }
    .drop-zone .icon { font-size: 26px; }

    /* ── File list ── */
    #fileList { margin-top: 10px; max-height: 140px; overflow-y: auto; }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 12px;
      margin-bottom: 5px;
      color: #cbd5e1;
    }
    .remove {
      background: none;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
    }

    /* ── Progress bar ── */
    #progressBar { display: none; margin-top: 10px; }
    #progressTrack {
      background: #1e293b;
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
    }
    #progressFill {
      height: 100%;
      background: linear-gradient(90deg, #059669, #6366f1);
      border-radius: 999px;
      width: 0%;
      transition: width 0.3s ease;
    }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>AI Chat → Open WebUI</h1>
    <p>Perplexity · ChatGPT · Gemini · Claude</p>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="import">📥 Import</button>
    <button class="tab" data-tab="settings">⚙️ Settings</button>
  </div>

  <!-- ── Import Panel ── -->
  <div class="panel active" id="tab-import">
    <div class="drop-zone" id="dropZone">
      <div class="icon">📂</div>
      <strong style="font-size:13px;">Drop JSON files here</strong>
      <p>or click to browse</p>
    </div>
    <input type="file" id="fileInput" accept=".json" multiple />

    <div id="fileList"></div>

    <button class="btn btn-indigo" id="importBtn" disabled>Import to Open WebUI</button>
    <button class="btn btn-red" id="clearBtn">🗑 Clear all</button>

    <div id="progressBar">
      <div id="progressTrack"><div id="progressFill"></div></div>
    </div>

    <div class="status" id="importStatus"></div>
  </div>

  <!-- ── Settings Panel ── -->
  <div class="panel" id="tab-settings">
    <label for="owuiDomain">Open WebUI URL</label>
    <input type="url" id="owuiDomain" placeholder="http://192.168.1.10:3000" />
    <div class="domain-preview" id="domainPreview">Enter your Open WebUI URL above</div>

    <label for="owuiToken">API Token</label>
    <div class="input-row">
      <input type="password" id="owuiToken" placeholder="sk-…" />
      <button class="icon-btn" id="toggleToken" title="Show/hide token">👁</button>
    </div>

    <button class="btn btn-green" id="saveBtn">💾 Save Settings</button>
    <div id="saveIndicator">✅ Settings saved!</div>
    <div class="status" id="settingsStatus"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
